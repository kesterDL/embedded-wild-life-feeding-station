name: Pi Zero Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "Pi_Zero/**"
      - ".github/workflows/pi-zero-unit-tests.yml"
  push:
    branches: [main]
    paths:
      - "Pi_Zero/**"
      - ".github/workflows/pi-zero-unit-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pi-zero: ${{ steps.filter.outputs.pi-zero }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for Pi Zero changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            pi-zero:
              - 'Pi_Zero/**'
              - '.github/workflows/pi-zero-unit-tests.yml'

  test:
    name: Run Pytest Unit Tests (3.12)
    needs: changes
    if: ${{ needs.changes.outputs.pi-zero == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    defaults:
      run:
        working-directory: Pi_Zero

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.6.12"
          enable-cache: true
          cache-dependency-glob: "Pi_Zero/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12 --frozen --dev

      - name: Run Unit Tests
        run: uv run --python 3.12 pytest
        env:
          CI: true
          TZ: UTC
