name: Arduino Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "Arduino_Nano/**"
      - ".github/workflows/arduino-unit-tests.yml"
  push:
    branches: [main]
    paths:
      - "Arduino_Nano/**"
      - ".github/workflows/arduino-unit-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
   changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      advisor: ${{ steps.filter.outputs.advisor }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for Arduino changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            arduino:
              - 'Arduino_Nano/**'
              - '.github/workflows/arduino-unit-tests.yml'

  firmware-cpp-tests:
    name: Run Firmware C++ Unit Tests
    needs: changes
    if: ${{ needs.changes.outputs.arduino == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile Watchdog FSM Unit Tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -DUNIT_TEST \
            -IArduino_Nano/include \
            Arduino_Nano/src/WatchdogFSM.cpp \
            Arduino_Nano/tests/test_watchdog_fsm.cpp \
            -o test_runner

      - name: Run Firmware Unit Tests
        run: ./test_runner
        env:
          CI: true

  harness-python-tests:
    name: Run Python Harness Unit Tests (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run Python Harness Tests
        run: python3 -m unittest Arduino_Nano/tests/test_pir_integration_script.py
        env:
          CI: true
          TZ: UTC
